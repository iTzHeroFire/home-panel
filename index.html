<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Home Panel</title>
<style>
:root{
  --accent:#f5f5f7; --accent-ink:#0b0b0d;
  --bg1:#141417; --bg2:#050506;
  --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.1);
  --stroke:rgba(255,255,255,.08);
  --text:#f5f5f7; --muted:rgba(245,245,247,.55); --faint:rgba(245,245,247,.26);
  --line:rgba(245,245,247,.42);
  --r:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:
  radial-gradient(1100px 700px at 30% -15%, color-mix(in srgb,var(--accent) 8%,transparent), transparent 60%),
  radial-gradient(800px 600px at 105% 105%, color-mix(in srgb,var(--accent) 6%,transparent), transparent 60%),
  linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
.room{position:fixed;inset:0;z-index:-1;pointer-events:none;background:#0d0c0b}
.room::after{content:"";position:absolute;inset:0;background:rgba(8,7,6,.42);pointer-events:none;transition:opacity .4s}
body.roommode .room::after{opacity:0}
.room svg{width:100%;height:100%;display:block;overflow:hidden}
#roomMini svg{overflow:hidden}
.room .lg,.roomcard .lg{transition:opacity 1.2s ease}
.room .dark,.roomcard .dark{transition:opacity 1.2s ease}
.tags .tag{opacity:0;transition:opacity .3s;pointer-events:none}
.tags .tag rect{fill:rgba(20,18,16,.72);stroke:rgba(255,255,255,.14)}
.tags .tag .tn{fill:#f5f5f7;font:600 19px var(--font)}
.tags .tag .ts{fill:rgba(245,245,247,.6);font:500 16px var(--font)}
body.roommode .room .tags .tag{opacity:1}
.roomcard{background:#1d1a17}
.roomcard .tags .tag{transform-box:fill-box}
.hit{cursor:pointer}
body:not(.roommode) .room .hit{pointer-events:none}
body.roommode .room{pointer-events:auto;z-index:25;background:#211e1b;display:block!important}
body.roommode .app{opacity:0;pointer-events:none}
.app{transition:opacity .4s}
.roomexit{position:fixed;top:calc(16px + env(safe-area-inset-top));right:18px;z-index:26;display:none;height:44px;padding:0 16px;border-radius:22px;align-items:center;gap:8px;font-weight:600}
body.roommode .roomexit{display:flex}
.roomclock{position:fixed;left:24px;top:calc(16px + env(safe-area-inset-top));z-index:26;display:none;font-size:40px;font-weight:200;color:rgba(255,255,255,.85);text-shadow:0 2px 20px rgba(0,0,0,.6)}
body.roommode .roomclock{display:block}
.roomcard{position:relative;flex:1 1 auto;min-height:140px;overflow:hidden;padding:0}
.roomcard #roomMini{position:absolute;inset:0}
.roomcard #roomMini svg{width:100%;height:100%}
.roomcard .rcx{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(20,18,16,.6);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html:has(body.has-room){background:#0d0c0b}
body.has-room{background:transparent}
body.has-room .glass{--glass:rgba(22,20,18,.36)}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
  -webkit-backdrop-filter:blur(16px) saturate(130%);backdrop-filter:blur(16px) saturate(130%);
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 0 0 1px rgba(0,0,0,.25),0 30px 60px -28px rgba(0,0,0,.9),0 10px 22px -14px rgba(0,0,0,.7);
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent 42%)}
.light.on{box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 30px 60px -28px rgba(0,0,0,.9),0 0 46px -14px var(--lc,#fff)}
.ac:not(.off){box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 30px 60px -28px rgba(0,0,0,.9),0 0 60px -30px var(--accent)}
.music.big .art{box-shadow:0 24px 50px -20px rgba(0,0,0,.9),0 0 70px -25px var(--accent)}
.bat{gap:10px;padding:0 12px;font-variant-numeric:tabular-nums;font-size:13px}
.bat .bi{display:flex;align-items:center;gap:5px}
.bat .bn{color:var(--muted)}
.bat .bi.low{color:#ff8a80}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.unavail{opacity:.4}

/* ---------- Layout ---------- */
.app{height:100vh;height:100dvh;display:grid;gap:16px;
  grid-template-columns:236px minmax(0,1fr) 296px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"music head head" "music main ac";
  padding:calc(16px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
header{grid-area:head;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.hleft{display:flex;align-items:flex-end;gap:18px;min-width:0;flex:1}
.hleft>div:last-child{min-width:0}
.hright{flex:none}
.greet{font-size:22px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.clock{font-size:52px;font-weight:200;letter-spacing:-2px;line-height:.9;font-variant-numeric:tabular-nums}
.date{color:var(--muted);font-size:15px;margin-top:4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 15px;border-radius:21px;font-size:15px;font-weight:500}
.iconbtn{width:42px;height:42px;border-radius:21px;display:grid;place-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 10px #ff6b6b}
.dot.ok{background:#5ee08a;box-shadow:0 0 10px #5ee08a}
.main{grid-area:main;display:flex;flex-direction:column;gap:16px;min-height:0}
.sechead{display:flex;align-items:center;justify-content:space-between;padding:0 6px;min-height:30px}
.link{font-size:14px;color:var(--muted);font-weight:500;padding:6px 12px;border-radius:14px;display:flex;gap:6px;align-items:center}
.link:active,.link.on{background:var(--glass-hi);color:var(--text)}

/* ---------- Music pill ---------- */
.side{grid-area:music;display:flex;flex-direction:column;gap:14px;min-height:0}
.music{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;flex:0 0 auto;position:relative;overflow:hidden;min-height:0}
.music>*{position:relative;z-index:1}
.music .artbg{position:absolute;inset:-30px;z-index:0;background:center/cover no-repeat;filter:blur(40px) saturate(150%);opacity:0;transition:opacity .5s}
.music.big .artbg{opacity:.42}
.mini{display:none;width:40px;height:40px;border-radius:20px;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.music.slim .mini{display:grid}
.music.slim .pwrap,.music.slim .mctl,.music.slim .vrow,.music.slim .devbtn{display:none}
.music.slim .art{width:44px;height:44px;border-radius:12px}
.music.big{flex:1 1 auto}
.music.big .mtop{flex-direction:column;align-items:stretch;flex:1 1 auto;min-height:0;gap:14px}
.music.big .art{flex:1 1 0;width:auto;height:auto;max-width:100%;aspect-ratio:1/1;align-self:center;min-height:0;border-radius:24px;box-shadow:0 24px 50px -20px rgba(0,0,0,.9)}
.music.big .mtop .minfo{flex:none}
.music.big .mini{display:none}
.music.big .mtitle{font-size:21px}
.music.big .martist{font-size:15px}
.music,.wx,.ac,.net{transition:flex .35s cubic-bezier(.2,.8,.2,1),background .3s}
.tapcard{cursor:pointer}
.mtop{display:flex;gap:12px;align-items:center;min-width:0}
.mtop .minfo{min-width:0;flex:1}
.art{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.06) center/cover no-repeat;display:grid;place-items:center;color:var(--faint);
  box-shadow:0 12px 28px -14px rgba(0,0,0,.8);flex:none}
/* weather */
.wx{padding:16px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;gap:10px}
.wx.slim{flex:0 0 auto;padding:12px 16px}
.wx.slim .hours,.wx.slim .hlab{display:none}
.wx.slim .wxt{font-size:30px}
.hours{row-gap:8px}
.wxnow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wxt{font-size:44px;font-weight:200;letter-spacing:-2px;line-height:1}
.wxc{font-size:13px;color:var(--muted);margin-top:4px}
.wxic{color:var(--text);opacity:.9}
.hours{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:-2px}
.hr{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:10px 0;border-radius:16px;background:rgba(255,255,255,.045)}
.hr b{color:var(--text);font-weight:600;font-size:14px}
.hr .rain{font-size:10px;color:#8ec5ff;height:12px}
/* internet speed */
.net{padding:14px 16px;flex:none}
.net.slim .netsub{display:none}
.net.slim .netbig{font-size:24px;margin-top:2px}
.nethead{display:flex;align-items:center;justify-content:space-between}
.netrun{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--muted)}
.netrun.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.netbig{font-size:34px;font-weight:200;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
.netbig small{font-size:14px;color:var(--muted);letter-spacing:0;margin-left:4px;font-weight:500}
.netsub{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.netsub b{color:var(--text);font-weight:600}
.mtitle{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.martist{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;touch-action:none}
.prog::after{content:"";position:absolute;inset:-14px 0}
.prog .fill,.vol .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--text)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.mctl{display:flex;align-items:center;justify-content:space-between}
.mctl button{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted)}
.mctl button.big{width:50px;height:50px;border-radius:25px;background:var(--accent);color:var(--accent-ink)}
.mctl button.mid{color:var(--text)}
.mctl button.act{color:var(--text)}
.mctl button.act::after{content:"";position:absolute;width:4px;height:4px;border-radius:2px;background:var(--text);margin-top:30px}
.vrow{display:flex;align-items:center;gap:10px;color:var(--muted)}
.vol{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;touch-action:none}
.vol::after{content:"";position:absolute;inset:-14px 0}
.devbtn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:rgba(255,255,255,.07);text-align:left;width:100%}
.devbtn .dn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devbtn .dl{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.music.off .mctl,.music.off .vrow,.music.off .prog,.music.off .times{opacity:.3;pointer-events:none}

/* ---------- Scenes ---------- */
.scenes{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.scene{position:relative;padding:10px 8px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-width:0;border-radius:22px;transition:transform .15s,background .3s}
.scene:active{transform:scale(.98)}
.scene .sic{width:38px;height:38px;flex:none;border-radius:19px;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:.3s}
.scene .sn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scene .ss{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene.flash{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.scene.flash .sic{background:var(--accent);color:var(--accent-ink)}
.scene .ed{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.editing .scene .ed{display:grid}
.editing .scene:not(.add){animation:jiggle .5s ease-in-out infinite alternate}
@keyframes jiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.scene.add{border-style:dashed;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:500;background:transparent}
.scene.add .sic{background:transparent;border:1px dashed var(--faint)}

/* ---------- Lights ---------- */
.lights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:none}
.light{padding:10px 12px 12px;display:flex;flex-direction:column;text-align:left;transition:background .3s,border-color .3s,transform .3s var(--spring,ease);touch-action:none;position:relative}
.light.on{background:var(--glass-hi);border-color:rgba(255,255,255,.14)}
.light .art2{height:62px;margin:0 -4px 6px;color:var(--lc,#fff)}
.light .ln{font-size:15px;font-weight:600}
.light .ls{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.light .bar{position:absolute;left:12px;right:12px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.light .bar i{position:absolute;inset:0 auto 0 0;background:var(--lc,#fff);transition:width .3s}
.light.press{transform:scale(.97)}
/* illustrations */
.ill .furn{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ill .fill{fill:rgba(255,255,255,.05)}
.ill .strip{stroke:rgba(255,255,255,.25);stroke-width:3;stroke-linecap:round;transition:stroke .4s}
.ill .glow{opacity:0;transition:opacity .6s}
.light.on .ill .strip{stroke:currentColor}
.light.on .ill .glow{opacity:1;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.75}}

/* ---------- AC ---------- */
.rcol{grid-area:ac;display:flex;flex-direction:column;gap:14px;min-height:0}
.ac{padding:16px;display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.ac:not(.big) #fanRow,.ac:not(.big) #swingRow{display:none}
.ac:not(.big) .dialc .big{font-size:48px}
.app[data-focus=ac] .net{display:none}
.offall{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;flex:none;border-radius:24px;transition:background .25s}
.offall .oic{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none;transition:.25s}
.offall .ot{font-weight:600;font-size:15px}
.offall .os{font-size:12px;color:var(--muted);margin-top:2px}
.offall.arm{background:rgba(255,80,80,.18);border-color:rgba(255,100,100,.35)}
.offall.arm .oic{background:#ff5c5c;color:#fff}
.achead{display:flex;justify-content:space-between;align-items:center}
.power{width:46px;height:46px;border-radius:23px;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:.25s}
.power.on{background:var(--accent);color:var(--accent-ink)}
.dialrow{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0}
.dialwrap{position:relative;flex:1;height:100%;max-width:230px;min-height:0;display:flex;align-items:center;justify-content:center}
.dialwrap svg.arc{width:100%;height:100%;max-height:220px}
.arc .trk{stroke:rgba(255,255,255,.09)}
.arc .val{stroke:var(--accent);transition:d .3s}
.arc .tick{stroke:rgba(255,255,255,.18)}
.dialc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dialc .big{font-size:64px;font-weight:200;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.dialc .big sup{font-size:24px;letter-spacing:0;vertical-align:top;position:relative;top:8px;color:var(--muted)}
.dialc .sub{font-size:13px;color:var(--muted);margin-top:4px}
.ac.off .dialc .big{color:var(--faint)}
.ac.off .arc .val{stroke:rgba(255,255,255,.2)}
.step{width:46px;height:46px;flex:none;border-radius:23px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.step:active{background:rgba(255,255,255,.18)}
.acrow{margin-top:14px}
.acrow .lab{margin:0 0 8px 4px;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.07);font-size:13px;font-weight:500;color:var(--muted)}
.chips button.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;top:50%;width:min(600px,calc(100vw - 28px));max-height:min(86vh,720px);overflow:auto;-webkit-overflow-scrolling:touch;
  transform:translate(-50%,-46%) scale(.97);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .28s;
  z-index:31;padding:22px;background:rgba(26,26,30,.9)}
.sheet.open{transform:translate(-50%,-50%);opacity:1;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.sheet h3{margin:0 0 4px;font-size:21px;padding-right:44px}
.sheet .hint{color:var(--muted);font-size:14px;margin:0 0 6px}
.sheet .sect{margin-top:18px}
.sheet .sect>.lab{margin:0 0 10px 2px;display:block}
.close{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;z-index:2;width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{height:46px;border-radius:14px;border:2px solid transparent;font-size:12px;font-weight:600;color:#111;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.sw.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--bg2) inset}
.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:19px;background:rgba(255,255,255,.08);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.sel{background:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;background:rgba(255,255,255,.06);padding:4px;border-radius:16px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.range{width:100%;-webkit-appearance:none;appearance:none;height:36px;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:36px;border-radius:12px;background:linear-gradient(90deg,var(--text) 0 var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:36px;border-radius:3px;background:transparent}
.range::-moz-range-track{height:36px;border-radius:12px;background:linear-gradient(90deg,var(--text) 0 var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
.range::-moz-range-thumb{width:6px;height:36px;border:0;background:transparent}
.txt{width:100%;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);padding:0 14px;font-size:16px;outline:none}
.txt:focus{border-color:rgba(255,255,255,.3)}
.erow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.erow .en{font-weight:600;font-size:15px}
.esub{padding:0 0 12px}
.esub .swatches{grid-template-columns:repeat(10,1fr)}
.esub .sw{height:30px;border-radius:10px;padding:0}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.icons button{height:46px;border-radius:14px;background:rgba(255,255,255,.07);display:grid;place-items:center}
.icons button.sel{background:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{height:48px;padding:0 20px;border-radius:24px;background:rgba(255,255,255,.08);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);margin-left:auto}
.btn.danger{color:#ff7b7b}
.stepper{display:inline-flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.stepper span{min-width:46px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.devlist{display:flex;flex-direction:column;gap:8px}
.dev{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);text-align:left}
.dev.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.dev .grow{flex:1;font-weight:600}

/* ---------- Idle ---------- */
.idle{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
.idle.show{opacity:1;pointer-events:auto}
.idle .ig{font-size:26px;font-weight:500;color:rgba(255,255,255,.5);margin-bottom:10px}
.idle .ic{font-size:150px;font-weight:100;letter-spacing:-6px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums;line-height:1}
.idle .id{font-size:20px;color:rgba(255,255,255,.4);margin-top:14px}
.idle .is{font-size:16px;color:rgba(255,255,255,.3);margin-top:28px;display:flex;gap:22px}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-140%);z-index:60;padding:12px 18px;border-radius:18px;font-size:14px;font-weight:500;
  background:rgba(40,40,46,.92);transition:transform .3s,visibility 0s .3s;max-width:90vw;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s}

/* ---------- Motion ---------- */
:root{--spring:cubic-bezier(.34,1.4,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
button{transition:transform .35s var(--spring),background-color .3s,color .3s,box-shadow .4s,opacity .3s}
button:active{transform:scale(.94);transition-duration:.08s}
.scene:active,.light:active{transform:scale(.97)}
.chips button,.seg button,.chip{transition:background-color .3s var(--ease),color .3s,transform .35s var(--spring)}
.prog .fill,.vol .fill,.light .bar i{transition:width .45s var(--ease)}
.intro .app .glass{animation:rise .7s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.tick{animation:tick .45s var(--spring)}
@keyframes tick{from{transform:translateY(var(--dy,8px));opacity:.35}}
.scene.flash{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.05)}}
.light.on .art2{animation:glowin .8s var(--ease)}
@keyframes glowin{from{filter:brightness(1.8)}}
.music{view-transition-name:music}.wx{view-transition-name:wx}.ac{view-transition-name:ac}.net{view-transition-name:net}
.offall{view-transition-name:offall}.roomcard{view-transition-name:roomcard}.scenes{view-transition-name:scenes}.lights{view-transition-name:lights}
::view-transition-group(*){animation-duration:.45s;animation-timing-function:var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Lyrics pill (Apple Music style, lightweight) ---------- */
.lyp{flex:1 1 0;min-height:90px;padding:12px 16px;border-radius:22px;display:none;overflow:hidden;position:relative;cursor:pointer}
.lyp.show{display:flex;flex-direction:column}
.lywin{flex:1;min-height:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 80%,transparent)}
.lylist{transition:transform .55s var(--ease)}
.lyl{line-height:22px;padding:1px 0;font-size:14px;font-weight:700;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(245,245,247,.3);transition:color .4s}
.lyl.cur{color:var(--text)}
.lyl .w{transition:color .25s}
.lyp.big .lyl{font-size:22px;line-height:29px;padding:5px 0;white-space:normal;letter-spacing:-.3px}
.lyp.big .lyl.cur{color:rgba(245,245,247,.38)}
.lyp.big .lyl.cur .w.on{color:var(--text)}
.lyp.big .lyl.cur .w.now{color:var(--text);text-shadow:0 0 18px color-mix(in srgb,var(--text) 45%,transparent)}
.lysrc{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:4px;display:none}
.lyp.big .lysrc{display:block}
.side .wx:not(.big):not(.slim).compact{flex:0 0 auto}
.ampm{font-size:.38em;font-weight:500;letter-spacing:0;margin-left:4px;color:var(--muted)}
/* ---------- Polish ---------- */
.scene.active{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 14%,var(--glass))}
.scene.active .sic{background:var(--accent);color:var(--accent-ink)}
.light .ls b{color:var(--text);font-weight:600}
.light.dragging{transform:scale(1.02)}
.light.dragging .bar{height:6px;bottom:7px}
.acinfo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.acinfo svg{flex:1;height:26px;min-width:0}
.acinfo .tr{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.acinfo .ta{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:none}
.acinfo .ao{white-space:nowrap;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.acinfo .ao i{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.18);position:relative;transition:background .3s}
.acinfo .ao i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:6px;background:#fff;transition:transform .3s var(--spring,ease)}
.acinfo .ao.on i{background:var(--accent)}
.acinfo .ao.on i::after{transform:translateX(11px)}
.bat{cursor:pointer}
.batlist{display:flex;flex-direction:column;gap:8px}
.batrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.batrow .bnm{flex:1;font-weight:600}
.batrow .bbar{width:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.batrow .bbar i{display:block;height:100%;border-radius:4px;background:#5ee08a}
.batrow.low .bbar i{background:#ff7b7b}
.night{position:fixed;inset:0;z-index:19;pointer-events:none;background:rgba(40,18,0,.42);opacity:0;transition:opacity 3s}
body.isnight .night{opacity:1}
.cpick{width:100%;height:46px;border:0;border-radius:14px;padding:0;background:none;cursor:pointer}
.cpick::-webkit-color-swatch-wrapper{padding:0}.cpick::-webkit-color-swatch{border:0;border-radius:14px}
/* ---------- Phone / portrait ---------- */
@media (max-width:900px),(orientation:portrait){
  .app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"head" "music" "main" "ac"}
  .wx{min-height:220px}
  .scenes{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:120px}
  .lights{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac{min-height:560px}
  .clock{font-size:42px}
  .hleft{flex-direction:column;align-items:flex-start;gap:6px}
  .greet{font-size:18px}
}
/* ---------- Phone: one screen, no scrolling. Swipe left for room, weather and speed. ---------- */
@media (max-width:600px){
  html,body{overflow:hidden;height:100%}
  .app{position:fixed;inset:0;height:100dvh;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    grid-template-columns:100vw 100vw;column-gap:0;row-gap:9px;
    grid-template-rows:auto auto auto auto minmax(0,1fr) auto auto auto;
    grid-template-areas:"head room" "shead room" "scenes room" "lhead room" "lights wx" "ac net" "off lyp" "music lyp";
    padding:calc(10px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom))}
  .app::-webkit-scrollbar{display:none}
  .side,.main,.rcol{display:contents}
  .app>*,.side>*,.main>*,.rcol>*{margin-inline:14px;min-width:0}
  header{grid-area:head;scroll-snap-align:start;padding:0 2px}
  #sHead{grid-area:shead;min-height:22px}#lHead{grid-area:lhead;min-height:22px}
  .scenes{grid-area:scenes;gap:8px;grid-auto-rows:auto}
  .roomcard{grid-area:room;min-height:0;scroll-snap-align:start}
  /* page-2 cards fill their area without stretching page-1 rows */
  .roomcard,.wx,.net,.lyp{contain:size;min-height:0}
  .wx{overflow:hidden}
  .lights{grid-area:lights;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px;min-height:0}
  .wx{grid-area:wx}.net{grid-area:net}.offall{grid-area:off}.music{grid-area:music}.lyp{grid-area:lyp}
  .ac{grid-area:ac}
  /* header */
  .clock{font-size:34px;letter-spacing:-1px}.greet{font-size:15px}.date{font-size:12px}
  .hleft{flex-direction:row;align-items:center;gap:12px}
  #bats,.hright .pill:not(.bat){display:none!important}
  .hright .iconbtn{width:38px;height:38px}
  /* scenes */
  .scene{height:72px;padding:8px 4px;border-radius:18px;gap:5px}
  .scene .sic{width:32px;height:32px}.scene .sic svg{width:18px;height:18px}
  .scene .sn{font-size:12px}
  /* lights */
  .light{padding:8px 10px 16px;min-height:0;border-radius:20px}
  .wx{padding:12px 14px;gap:6px}.wxt{font-size:34px}.wxc{font-size:12px}
  .hr{padding:6px 0;gap:3px}
  .light .art2{height:auto;flex:1;min-height:30px;margin-bottom:4px}
  .light .ln{font-size:14px}.light .ls{font-size:12px}
  /* AC: one compact row + modes */
  .ac{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;padding:10px 12px;min-height:0;border-radius:22px}
  .achead{flex-direction:column;align-items:flex-start;gap:6px;justify-content:center}
  .achead .lab{font-size:10px}
  .power{width:40px;height:40px}
  .dialrow{margin:0;gap:4px;justify-content:flex-end}
  .dialwrap{height:auto;max-width:none;flex:none}
  .dialwrap svg.arc{display:none}
  .dialc{position:static;padding:0 8px}
  .dialc .big,.ac:not(.big) .dialc .big{font-size:36px;letter-spacing:-1.5px}
  .dialc .big sup{font-size:14px;top:4px}
  .dialc .sub{font-size:11px;margin-top:0}
  .step{width:40px;height:40px}
  .ac .acrow{grid-column:1/-1;margin-top:0}
  .ac .acrow .lab{display:none}
  .ac .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ac .chips button{flex:none;height:30px}
  .ac #fanRow,.ac #swingRow,.ac .acinfo{display:none}
  /* everything off + music bar */
  .offall{padding:8px 12px;border-radius:20px}.offall .oic{width:36px;height:36px}.offall .os{display:none}
  .music{padding:8px 10px;border-radius:20px;flex:none}
  .music .art{width:44px;height:44px;border-radius:12px}
  .music .mini{display:grid}
  .music:not(.big) .pwrap,.music:not(.big) .mctl,.music:not(.big) .vrow,.music:not(.big) .devbtn{display:none}
  /* tapping Spotify or the AC on the phone opens it as a sheet over the bottom of the screen */
  .music.big,.ac.big{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:28;margin:0;
    background:rgba(26,26,30,.94);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  .music.big{display:flex;flex-direction:column;gap:12px;padding:16px}
  .music.big .mtop{flex-direction:row;align-items:center}
  .music.big .art{width:64px;height:64px;flex:none;aspect-ratio:auto}
  .music.big .mini{display:none}
  .ac.big{display:flex;flex-direction:column;padding:16px}
  .ac.big .dialwrap svg.arc{display:block;max-height:180px}
  .ac.big .dialc{position:absolute;padding:0}
  .ac.big .dialwrap{flex:1;height:200px;max-width:220px}
  .ac.big #fanRow{display:block}.ac.big .acrow .lab{display:block}
  .app[data-focus] .scenes,.app[data-focus] .lights{filter:brightness(.6)}
}
</style>
</head>
<body>
<div class="room" id="room"></div>
<div class="app" id="app">
  <aside class="side">
  <section class="music glass off tapcard" id="music">
    <div class="artbg" id="artBg"></div>
    <div class="mtop"><div class="art" id="art"></div>
    <div class="minfo"><div class="mtitle" id="mTitle">Spotify</div><div class="martist" id="mArtist">Not connected yet</div></div>
    <button class="mini" id="mMini" aria-label="Play or pause"></button></div>
    <div class="pwrap"><div class="prog" id="prog"><div class="fill" id="progFill"></div></div>
      <div class="times"><span id="tPos">0:00</span><span id="tDur">0:00</span></div></div>
    <div class="mctl">
      <button id="mShuf" aria-label="Shuffle"></button>
      <button class="mid" id="mPrev" aria-label="Previous"></button>
      <button class="big" id="mPlay" aria-label="Play or pause"></button>
      <button class="mid" id="mNext" aria-label="Next"></button>
      <button id="mRep" aria-label="Repeat"></button>
    </div>
    <div class="vrow" id="vrow"><span id="vIco"></span><div class="vol" id="vol"><div class="fill" id="volFill"></div></div></div>
    <button class="devbtn" id="devBtn"><span id="devIco"></span><span style="min-width:0"><div class="dl">Playing on</div><div class="dn" id="devName">Choose a device</div></span></button>
  </section>
  <section class="lyp glass" id="lyp"><div class="lysrc" id="lySrc">Lyrics</div><div class="lywin" id="lyWin"><div class="lylist" id="lyList"></div></div></section>
  <section class="wx glass tapcard" id="wx">
    <div class="wxnow"><div><div class="wxt" id="wxT">--°</div><div class="wxc" id="wxC">Weather</div></div><div class="wxic" id="wxIc"></div></div>
    <div class="lab hlab" style="font-size:11px">Next hours</div>
    <div class="hours" id="hours"></div>
  </section>
  </aside>

  <header>
    <div class="hleft"><div class="clock" id="clock">--:--</div><div><div class="greet" id="greet"></div><div class="date" id="date"></div></div></div>
    <div class="hright">
      <div id="bats" style="display:flex;gap:8px"></div>
      <div class="pill glass"><span class="dot" id="conn"></span><span id="connTxt">Connecting</span></div>
      <button class="iconbtn glass" id="settingsBtn" aria-label="Settings"></button>
    </div>
  </header>

  <main class="main">
    <div class="sechead" id="sHead"><span class="lab">Scenes</span><button class="link" id="editBtn">Edit</button></div>
    <section class="scenes" id="scenes"></section>
    <section class="roomcard glass" id="roomCard"><div id="roomMini"></div><button class="rcx" id="roomOpen" aria-label="Full-screen room"></button></section>
    <div class="sechead" id="lHead"><span class="lab">Lights</span><span style="display:flex;gap:4px"><button class="link" id="allLights">All lights</button><button class="link" id="allOff">All off</button></span></div>
    <section class="lights" id="lights"></section>
  </main>

  <section class="rcol">
  <section class="ac glass tapcard" id="ac">
    <div class="achead"><span class="lab" id="acName">Air conditioner</span><button class="power" id="acPower" aria-label="AC power"></button></div>
    <div class="dialrow"><button class="step" id="tDown" aria-label="Lower"></button>
    <div class="dialwrap">
      <svg class="arc" viewBox="0 0 220 200" id="arcSvg"></svg>
      <div class="dialc"><div class="big" id="tBig">--<sup>°</sup></div><div class="sub" id="tSub">Room --</div></div>
    </div>
    <button class="step" id="tUp" aria-label="Raise"></button></div>
    <div class="acrow"><div class="lab">Mode</div><div class="chips" id="modes"></div></div>
    <div class="acinfo" id="acInfo"><svg id="trend" viewBox="0 0 200 26" preserveAspectRatio="none"></svg><button class="ao" id="acAuto" aria-label="Turn the 7:30 AM auto-off on or off"></button></div>
    <div class="acrow" id="fanRow"><div class="lab">Fan</div><div class="chips" id="fans"></div></div>
    <div class="acrow" id="swingRow"><div class="lab">Swing</div><div class="chips" id="swings"></div></div>
  </section>
  <section class="net glass" id="net">
    <div class="nethead"><span class="lab">Internet speed</span><button class="netrun" id="netRun" aria-label="Run speed test"></button></div>
    <div class="netbig" id="netDown">--<small>Mbps</small></div>
    <div class="netsub" id="netSub">Not set up yet</div>
  </section>
  <button class="offall glass" id="offAll"><span class="oic" id="offIco"></span><span><div class="ot" id="offT">Everything off</div><div class="os" id="offS">Lights, AC and music</div></span></button>
  </section>
</div>

<button class="roomexit glass" id="roomExit"></button><div class="roomclock" id="roomClock"></div>
<div class="night"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet"><button class="close" id="sheetClose" aria-label="Close"></button><div id="sheetBody"></div></div>
<div class="idle" id="idle"><div class="ig" id="iGreet"></div><div class="ic" id="iClock"></div><div class="id" id="iDate"></div><div class="is" id="iSum"></div></div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   SETTINGS — entity IDs come from Home Assistant (Settings → Entities).
   art: which illustration to draw — "bed", "desk", "cove-left", "cove-right"
   ===================================================================== */
const CONFIG = {
  name: "Fahad",         // used in the greeting
  lights: [
    { id: "light.bedroom_tapo_l930_ceiling",   name: "Ceiling 1", art: "cove-left" },
    { id: "light.bedroom_tapo_l930_ceiling_2", name: "Ceiling 2", art: "cove-right" },
    { id: "light.bedroom_tapo_l930_bed",       name: "Bed",       art: "bed" },
    { id: "light.bedroom_desk",                name: "Desk",      art: "desk" },
  ],
  climate: "climate.panasonic_ac_panasonic_ac",   // if this one disappears, the panel uses any other AC it finds
  climateName: "Air conditioner",
  media: "auto",        // "auto" picks the Spotify player
  weather: "auto",
  speedtest: "auto",   // uses the Speedtest.net integration sensors
  motionSensor: "",     // e.g. "binary_sensor.panel_motion" — wakes the screen
  idleSeconds: 90,
};

/* Starter scenes (your Tapo shortcuts) — used until you save your own; edits are saved in Home Assistant. */
const L = CONFIG.lights.map(l => l.id);   // [Ceiling 1, Ceiling 2, Bed, Desk]
const WARM = { k: 2700 };
const AC24 = { m: "set", hvac: "cool", t: 24, fan: "" };
const DEFAULT_SCENES = [
  { id: "study", name: "Study", icon: "book", lights: { [L[0]]: { m: "off" }, [L[1]]: { m: "off" }, [L[2]]: { m: "off" }, [L[3]]: { m: "on", b: 100, c: WARM } }, ac: AC24 },
  { id: "wmax", name: "WMax", icon: "sun", lights: { [L[0]]: { m: "on", b: 100, c: WARM }, [L[1]]: { m: "on", b: 100, c: WARM }, [L[2]]: { m: "on", b: 100, c: WARM }, [L[3]]: { m: "on", b: 100, c: WARM } }, ac: AC24 },
  { id: "max", name: "Max", icon: "bulb", lights: { [L[0]]: { m: "on", b: 100, c: { k: 5000 } }, [L[1]]: { m: "on", b: 100, c: { k: 5000 } }, [L[2]]: { m: "on", b: 100, c: { k: 5000 } }, [L[3]]: { m: "on", b: 100, c: { k: 5000 } } }, ac: AC24 },
  { id: "sleep", name: "Sleep", icon: "moon", lights: { [L[0]]: { m: "off" }, [L[1]]: { m: "on", b: 2, c: WARM }, [L[2]]: { m: "off" }, [L[3]]: { m: "off" } }, ac: { m: "set", hvac: "cool", t: 22, fan: "" } },
];
const SCENES_KEY = "homepanel_scenes_v2";

const ACCENTS = [
  { name: "Oak", c: "#e9c9a0", ink: "#1d140a" },
  { name: "Mono", c: "#f5f5f7", ink: "#0b0b0d" }, { name: "Ice", c: "#9cccff", ink: "#06121f" },
  { name: "Ember", c: "#ff7a3d", ink: "#1f0a02" }, { name: "Amber", c: "#ffbf73", ink: "#1f1204" },
  { name: "Sage", c: "#a8dcbc", ink: "#07170e" }, { name: "Rose", c: "#ffa8ba", ink: "#200810" },
  { name: "Lavender", c: "#c9b0ff", ink: "#120a24" },
];
const BACKDROPS = [

const DEMO = location.protocol === "file:" || new URLSearchParams(location.search).has("demo");
const ORIGIN = location.origin, CLIENT_ID = ORIGIN + "/", REDIRECT = ORIGIN + location.pathname;
let S = {}, ws = null, msgId = 1, pending = {}, subs = {}, retry = 0, forecast = [];

async function tokenRequest(params){
  const r = await fetch(ORIGIN + "/auth/token", { method: "POST", body: new URLSearchParams({ client_id: CLIENT_ID, ...params }) });
  if (!r.ok) throw new Error("token " + r.status);
  const t = await r.json(); t.expires_at = Date.now() + (t.expires_in - 60) * 1000; return t;
}
function signIn(){
  location.href = `${ORIGIN}/auth/authorize?response_type=code&client_id=${encodeURIComponent(CLIENT_ID)}&redirect_uri=${encodeURIComponent(REDIRECT)}&state=p`;
}
async function getToken(force){
  const q = new URLSearchParams(location.search);
  if (q.get("code")) {
    const t = await tokenRequest({ grant_type: "authorization_code", code: q.get("code") });
    store.set("tokens", t); history.replaceState(null, "", REDIRECT); return t.access_token;
  }
  let t = store.get("tokens", null);
  if (!t) { signIn(); throw new Error("signin"); }
  if (force || Date.now() > t.expires_at) {
    try { const n = await tokenRequest({ grant_type: "refresh_token", refresh_token: t.refresh_token }); t = { ...n, refresh_token: t.refresh_token }; store.set("tokens", t); }
    catch (e) { if (/40[01]/.test(String(e))) { store.set("tokens", null); signIn(); } throw e; }
  }
  return t.access_token;
}
function send(msg){
  return new Promise((res, rej) => {
    if (!ws || ws.readyState !== 1) return rej(new Error("offline"));
    const id = msgId++; pending[id] = { res, rej }; ws.send(JSON.stringify({ id, ...msg }));
  });
}
async function connect(force){
  setConn(false, "Connecting");
  let token;
  try { token = await getToken(force); } catch (e) { if (String(e).includes("signin")) return; return scheduleReconnect(); }
  ws = new WebSocket(ORIGIN.replace(/^http/, "ws") + "/api/websocket");
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "auth_required") ws.send(JSON.stringify({ type: "auth", access_token: token }));
    else if (m.type === "auth_invalid") { ws.onclose = null; ws.close(); connect(true); }
    else if (m.type === "auth_ok") {
      retry = 0; offlineSince = 0; msgId = 1; pending = {}; subs = {};
      const states = await send({ type: "get_states" });
      S = {}; states.forEach(s => S[s.entity_id] = s);
      pickClimate();
      await send({ type: "subscribe_events", event_type: "state_changed" });
      subscribeForecast(); loadOokla(); loadTrend();
      await loadScenes();
      setConn(true); render();
    }
    else if (m.type === "result") {
      const p = pending[m.id]; if (!p) return; delete pending[m.id];
      m.success ? p.res(m.result) : p.rej(new Error(m.error && m.error.message || "failed"));
    }
    else if (m.type === "event" && subs[m.id]) subs[m.id](m.event);
    else if (m.type === "event" && m.event && m.event.event_type === "state_changed") {
      const d = m.event.data;
      if (d.new_state) S[d.entity_id] = d.new_state; else delete S[d.entity_id];
      if (d.new_state && d.new_state.state === "on" && (CONFIG.motionSensor ? d.entity_id === CONFIG.motionSensor
          : d.entity_id.startsWith("binary_sensor.") && /occupancy|presence|motion/.test(d.new_state.attributes.device_class || ""))) wake();
      scheduleRender();
    }
  };
  ws.onclose = () => { setConn(false, "Offline"); scheduleReconnect(); };
}
function subscribe(msg, cb){
  if (!ws || ws.readyState !== 1) return;
  const id = msgId++; subs[id] = cb; pending[id] = { res(){}, rej(){ delete subs[id]; } };
  ws.send(JSON.stringify({ id, ...msg }));
}
function weatherEntity(){ return CONFIG.weather === "auto" ? Object.keys(S).find(k => k.startsWith("weather.")) : CONFIG.weather; }
function subscribeForecast(){
  const id = weatherEntity(); if (!id) return;
  subscribe({ type: "weather/subscribe_forecast", entity_id: id, forecast_type: "hourly" }, ev => { forecast = (ev && ev.forecast) || []; renderWeather(); });

let offlineSince = 0;
function scheduleReconnect(){
  retry = Math.min(retry + 1, 6);
  if (!offlineSince) offlineSince = Date.now();
  // Home Assistant can take a few minutes to boot after a power cut. If we've been offline for 3+ minutes,
  // reload the whole page once it answers again, so everything (scenes, forecast, lyrics) starts fresh.
  if (Date.now() - offlineSince > 180000) {
    fetch(ORIGIN + "/manifest.json", { cache: "no-store" }).then(r => { if (r.ok) location.reload(); }).catch(() => {});
  }
  setTimeout(() => connect(), 500 * 2 ** retry);
}

const MDI = { book: "mdi:book-open-variant", sun: "mdi:white-balance-sunny", bulb: "mdi:lightbulb-on", moon: "mdi:weather-night", sofa: "mdi:sofa",
  target: "mdi:target", film: "mdi:movie-open", coffee: "mdi:coffee", game: "mdi:controller", bed: "mdi:bed", power: "mdi:power", music: "mdi:music" };
const scriptKey = sc => "panel_" + String(sc.id).toLowerCase().replace(/[^a-z0-9_]/g, "_");
function sceneSequence(sc){
  const seq = [], lights = sc.lights || {};
  const offs = Object.keys(lights).filter(id => lights[id].m === "off");
  if (offs.length) seq.push({ action: "light.turn_off", target: { entity_id: offs } });
  Object.keys(lights).filter(id => lights[id].m === "on").forEach(id => {
    const v = lights[id], data = { brightness_pct: v.b ?? 100 };
    if (v.c && v.c.k) data.color_temp_kelvin = v.c.k; if (v.c && v.c.rgb) data.rgb_color = v.c.rgb;
    seq.push({ action: "light.turn_on", target: { entity_id: id }, data });
  });
  const ac = sc.ac || {};
  const T = { entity_id: CONFIG.climate };
  if (ac.m === "off") seq.push({ action: "climate.set_hvac_mode", target: T, data: { hvac_mode: "off" } });
  if (ac.m === "set") {
    seq.push({ action: "climate.set_hvac_mode", target: T, data: { hvac_mode: ac.hvac || "cool" } }, { delay: { seconds: 2 } });
    if (ac.t != null) seq.push({ action: "climate.set_temperature", target: T, data: { temperature: ac.t } });
    if (ac.fan) seq.push({ delay: { seconds: 2 } }, { action: "climate.set_fan_mode", target: T, data: { fan_mode: ac.fan } });
  }
  return seq;
}
async function api(method, path, body){
  const token = await getToken();

  if (!r.ok) throw new Error(path + " " + r.status);
  return r;
}

const WICON = { sunny: "sun", "clear-night": "moon", partlycloudy: "pcloud", cloudy: "cloud", rainy: "rain", pouring: "rain",
  lightning: "bolt", "lightning-rainy": "bolt", fog: "fog", windy: "wind", "windy-variant": "wind", snowy: "snow", hail: "rain", exceptional: "sparkle" };
const WNAME = { partlycloudy: "Partly cloudy", "clear-night": "Clear", "lightning-rainy": "Thunderstorms", "windy-variant": "Windy", pouring: "Heavy rain" };
function renderWeather(){
  const id = weatherEntity(), s = id && S[id];
  if (!s) { $("wxT").textContent = "--°"; $("wxC").textContent = "No weather service"; $("hours").innerHTML = ""; return; }
  const a = s.attributes;

  $("wxC").textContent = (WNAME[s.state] || nice(s.state)) + (a.humidity != null ? ` · ${Math.round(a.humidity)}% humidity` : "");
  $("wxIc").innerHTML = icon(WICON[s.state] || "cloud", 40, 1.3);
  const now = Date.now() - 30 * 60000;
  const next = forecast.filter(f => Date.parse(f.datetime) >= now).slice(0, focus === "wx" ? 15 : (focus === "music" || focus === "ly") ? 0 : $("wx").classList.contains("compact") ? 5 : 10);
  const key = focus + next.map(f => f.datetime + f.temperature + f.condition).join();
  if ($("hours").dataset.k === key) return; $("hours").dataset.k = key;
  $("hours").innerHTML = next.map(f => {

    const rain = f.precipitation_probability != null ? (f.precipitation_probability >= 20 ? f.precipitation_probability + "%" : "") : (f.precipitation ? f.precipitation + "mm" : "");
    return `<div class="hr"><span>${h}</span>${icon(WICON[f.condition] || "cloud", 20, 1.6)}<b>${Math.round(f.temperature)}°</b><span class="rain">${rain}</span></div>`;

}

/* ---- Internet speed (Speedtest.net integration) ---- */
function speedIds(){
  const ids = Object.keys(S).filter(k => k.startsWith("sensor.") && k.includes("speedtest"));
  return { down: ids.find(k => k.includes("download")), up: ids.find(k => k.includes("upload")), ping: ids.find(k => k.includes("ping")) };
}
const num = s => s && !isNaN(parseFloat(s.state)) ? parseFloat(s.state) : null;
function ago(iso){ const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago"; }
let netTesting = false;
/* Preferred source: Ookla's official speed test, run on the mini PC (writes /local/speed.json).
   Falls back to the Speedtest.net integration sensors if that isn't set up. */
let ookla = null;
async function loadOokla(){
  if (DEMO) return;
  try { const r = await fetch(ORIGIN + "/local/speed.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j.download) ookla = j; } } catch {}
  renderNet();
}
function renderNet(){
  if (ookla) {
    const mb = b => Math.round(b * 8 / 1e6);
    $("netDown").innerHTML = mb(ookla.download.bandwidth) + "<small>Mbps</small>";
    $("netSub").innerHTML = `<span>↑ <b>${mb(ookla.upload.bandwidth)}</b></span><span><b>${Math.round(ookla.ping.latency)}</b> ms</span><span>${ago(ookla.timestamp)}</span>`;
    return;
  }
  const ids = speedIds(), d = num(S[ids.down]), u = num(S[ids.up]), p = num(S[ids.ping]);
  if (!ids.down) { $("netDown").innerHTML = `--<small>Mbps</small>`; $("netSub").textContent = "Speed test not set up"; return; }
  $("netDown").innerHTML = (d == null ? "--" : Math.round(d)) + "<small>Mbps</small>";
  $("netSub").innerHTML = `<span>↑ <b>${u == null ? "--" : Math.round(u)}</b></span><span><b>${p == null ? "--" : Math.round(p)}</b> ms</span><span>${S[ids.down] ? ago(S[ids.down].last_updated) : ""}</span>`;
}
function runSpeedtest(){
  if (netTesting) return;
  const ids = speedIds();
  netTesting = true; $("netRun").classList.add("spin"); toast("Testing speed… about 30 seconds");
  const done = () => { netTesting = false; $("netRun").classList.remove("spin"); };
  if (DEMO) return setTimeout(() => { S[ids.down].state = String(90 + Math.round(Math.random() * 60)); S[ids.down].last_updated = new Date().toISOString(); renderNet(); done(); }, 1500);
  send({ type: "call_service", domain: "shell_command", service: "speedtest", service_data: {} })
    .then(() => loadOokla())
    .catch(() => ids.down ? call("homeassistant", "update_entity", { entity_id: [ids.down, ids.up, ids.ping].filter(Boolean) }) : toast("Speed test isn't set up yet"))
    .finally(() => setTimeout(done, 1000));
}
setInterval(loadOokla, 5 * 60000);

  const on = CONFIG.lights.filter(l => S[l.id] && S[l.id].state === "on").length, ac = S[CONFIG.climate];
  const m = mediaEntity() && S[mediaEntity()];
  $("iSum").innerHTML = `<span>${on ? on + " light" + (on > 1 ? "s" : "") + " on" : "Lights off"}</span>${ac ? `<span>${ac.state === "off" ? "AC off" : "AC " + fmtT(ac.attributes.temperature) + "°"}</span>` : ""}${m && m.state === "playing" && m.attributes.media_title ? `<span>♪ ${esc(m.attributes.media_title)}</span>` : ""}`;
}
function sleep(){ closeSheet(); clearTimeout(lyTimer); if (focus) setFocus(""); document.body.classList.remove("roommode"); roomFit(false); $("idle").classList.add("show"); }
function wake(){ lastTouch = Date.now(); if ($("idle").classList.contains("show")) swallowUntil = Math.max(swallowUntil === Infinity ? 0 : swallowUntil, Date.now() + 600); $("idle").classList.remove("show"); scheduleLyrics(); }
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, true));
/* Waking: the first touch only wakes the screen. The overlay stays until the finger lifts, and any tap
   that follows within 0.6 s is swallowed, so nothing underneath gets pressed by accident. */
let swallowUntil = 0;
const swallow = e => { if (e.target && e.target.closest && e.target.closest("#idle")) return; if (Date.now() < swallowUntil) { e.stopPropagation(); e.preventDefault(); } };
["click", "pointerup", "pointerdown", "touchend", "contextmenu"].forEach(ev => document.addEventListener(ev, swallow, { capture: true, passive: false }));
$("idle").addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); swallowUntil = Infinity; });
const finishWake = e => { if (!$("idle").classList.contains("show")) return; if (e) { e.stopPropagation(); e.preventDefault(); } wake(); swallowUntil = Date.now() + 600; };
$("idle").addEventListener("pointerup", finishWake);
$("idle").addEventListener("pointercancel", finishWake);
let toastTimer;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3000); }

function demoCall(domain, service, d){
  [].concat(d.entity_id).forEach(id => {
    const s = S[id]; if (!s) return; const a = s.attributes;
    if (domain === "light") {
      if (service === "turn_off") s.state = "off";
      else { if (service === "turn_on" && s.state === "off" && d.brightness_pct == null && !a.brightness) a.brightness = 180;
        s.state = "on"; if (d.brightness_pct != null) a.brightness = Math.round(d.brightness_pct * 2.55);
        if (d.color_temp_kelvin) { a.color_temp_kelvin = d.color_temp_kelvin; delete a.rgb_color; }
        if (d.rgb_color) { a.rgb_color = d.rgb_color; delete a.color_temp_kelvin; } if (d.effect) a.effect = d.effect; }
    } else if (domain === "climate") {
      if (service === "turn_off") s.state = "off"; if (service === "set_hvac_mode") s.state = d.hvac_mode;
      if (service === "set_temperature") { a.temperature = d.temperature; if (d.hvac_mode) s.state = d.hvac_mode; }
      if (service === "set_fan_mode") a.fan_mode = d.fan_mode;
    } else if (domain === "media_player") {
      if (service === "media_play_pause") { a.media_position = position(s); a.media_position_updated_at = new Date().toISOString(); s.state = s.state === "playing" ? "paused" : "playing"; }
      if (service === "media_pause") s.state = "paused";
      if (service === "volume_set") a.volume_level = d.volume_level;
      if (service === "media_seek") { a.media_position = d.seek_position; a.media_position_updated_at = new Date().toISOString(); }
      if (service === "select_source") a.source = d.source;
      if (service === "media_play") s.state = "playing";
      if (service === "shuffle_set") a.shuffle = d.shuffle;
      if (service === "repeat_set") a.repeat = d.repeat;
    }
  });
  scheduleRender();
}
